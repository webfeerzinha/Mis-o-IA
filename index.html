<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Jornada Dev - Descubra seu Perfil</title>
</head>
<body>
    <div class="caixa-principal">
        <header>
            <span class="tagline">Análise de Perfil</span>
            <h1>Jornada Developer</h1>
            <div class="barra-progresso">
                <div class="progresso" id="progresso"></div>
            </div>
        </header>

        <main>
            <div class="caixa-perguntas"></div>
            <div class="caixa-alternativas"></div>
            <div class="caixa-resultado">
                <p class="texto-resultado"></p>
                <button class="btn-reiniciar" id="btn-reiniciar" style="display: none;">Reiniciar Teste</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
